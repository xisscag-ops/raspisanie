name: Build Android APK

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk ngieu-c25io-schedule.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngieu-c25io-schedule-debug-apk
          path: ngieu-c25io-schedule.apk
          if-no-files-found: error

      - name: Publish GitHub Release on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ngieu-c25io-schedule.apk --clobber
          else
            gh release create "$TAG" ngieu-c25io-schedule.apk \
              --target "${{ github.sha }}" \
              --title "Расписание НГИЭУ С-25ИО ($TAG)" \
              --notes "Автоматическая сборка APK из ветки \`main\` (коммит \`${{ github.sha }}\`)." \
              --latest
          fi

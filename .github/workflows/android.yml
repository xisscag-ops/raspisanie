name: Build Android APK

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version metadata
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG="v${VERSION_NAME}"
          APK_NAME="ngieu-c25io-schedule-${TAG}.apk"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew testDebugUnitTest --console=plain 2>&1 | tee test.log; then
            grep -E "^(e: |ERROR:|FAILURE:|> Task .* FAILED|Caused by:|.*Test.*FAILED)" test.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build signed Release APK
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease -PappVersionCode=${{ env.VERSION_CODE }} -PappVersionName=${{ env.VERSION_NAME }} --console=plain 2>&1 | tee build.log; then
            grep -E "^(e: |FAILURE:|> Task .* FAILED|Caused by:)" build.log | head -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Prepare versioned APK file
        run: cp app/build/outputs/apk/release/app-release.apk "${{ env.APK_NAME }}"

      - name: Inspect compiled APK launcher aliases and icon assets
        run: |
          AAPT2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            echo "=== Manifest activity-alias & application icon ==="
            "$AAPT2" dump xmltree "${{ env.APK_NAME }}" --file AndroidManifest.xml | tee manifest_tree.txt | grep -E "E: (application|activity|activity-alias)|A: android:(name|icon|roundIcon|enabled|exported|targetActivity)"
            python3 - << 'PY'
          import re, sys

          text = open("manifest_tree.txt", encoding="utf-8").read()
          blocks = re.split(r'(?=\n\s+E: (?:activity|activity-alias)\b)', text)
          alias_icons = {}
          for b in blocks:
              m_name = re.search(r'A: android:name\([^)]+\)="([^"]+)"', b)
              if not m_name:
                  continue
              name = m_name.group(1)
              if "LauncherAlias" in name:
                  m_icon = re.search(r'A: android:icon\([^)]+\)=@(0x[0-9a-fA-F]+)', b)
                  m_en = re.search(r'A: android:enabled\([^)]+\)=\(type 0x12\)(0x[0-9a-fA-F]+)', b)
                  alias_icons[name] = (m_icon.group(1) if m_icon else None, m_en.group(1) if m_en else None)
              elif name.endswith(".MainActivity"):
                  m_exp = re.search(r'A: android:exported\([^)]+\)=\(type 0x12\)(0x[0-9a-fA-F]+)', b)
                  assert m_exp and m_exp.group(1) == "0x0", f"MainActivity exported mismatch: {m_exp}"

          print("Parsed aliases:", alias_icons)
          assert len(alias_icons) == 5, f"Expected 5 aliases, got {alias_icons}"
          icons = [v[0] for v in alias_icons.values()]
          assert all(icons) and len(set(icons)) == 5, f"Alias icons not distinct: {alias_icons}"
          for name, (_, en) in alias_icons.items():
              expected = "0xffffffff" if name.endswith("LauncherAliasDark") else "0x0"
              assert en == expected, f"{name} enabled={en}, expected {expected}"
          PY
          fi
          echo "=== Launcher assets in APK ==="
          unzip -l "${{ env.APK_NAME }}" | grep -E "ic_launcher|ic_icon_preview" | tee apk_assets.txt
          python3 - << 'PY'
          import sys
          for line in open("apk_assets.txt", encoding="utf-8"):
              parts = line.split()
              if parts and parts[0].isdigit():
                  size = int(parts[0])
                  assert size > 80, f"Suspiciously small/shrunk icon asset: {line.strip()}"
          PY

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ngieu-c25io-schedule-apk
          path: ngieu-c25io-schedule-v*.apk
          if-no-files-found: error

      - name: Publish GitHub Release on main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
            gh release upload "${{ env.TAG }}" "${{ env.APK_NAME }}" --clobber
          else
            gh release create "${{ env.TAG }}" "${{ env.APK_NAME }}" \
              --target "${{ github.sha }}" \
              --title "Расписание НГИЭУ С-25ИО ${{ env.TAG }}" \
              --notes "Версия: **${{ env.VERSION_NAME }}** (build ${{ env.VERSION_CODE }}). Подписана постоянным ключом — обновляется поверх предыдущей версии без удаления приложения." \
              --latest
          fi
